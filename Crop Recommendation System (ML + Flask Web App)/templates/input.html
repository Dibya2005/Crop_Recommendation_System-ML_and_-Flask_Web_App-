<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <title>🌾 Crop Recommendation</title>
</head>
<body>
    <h1>🌱 Crop Recommendation System</h1>
    <form method="POST" action="/predict">
        <label for="">Nitrogen</label>
        <input name="N" placeholder="Nitrogen (N)" required value="{{ values.N if values else '' }}"><br>

        <label for="">Phosphorus</label>
        <input name="P" placeholder="Phosphorus (P)" required value="{{ values.P if values else '' }}"><br>

        <label for="">Potassium</label>
        <input name="K" placeholder="Potassium (K)" required value="{{ values.K if values else '' }}"><br>

        <label for="">Temperature</label>
        <input name="temperature" step="0.1" placeholder="Temperature (°C)" required value="{{ values.temperature if values else '' }}"><br>

        <label for="">Humidity</label>
        <input name="humidity" step="0.1" placeholder="Humidity (%)" required value="{{ values.humidity if values else '' }}"><br>

        <label for="">pH</label>
        <input name="ph" step="0.1" placeholder="pH" required value="{{ values.ph if values else '' }}"><br>

        <label for="">Rainfall</label>
        <input name="rainfall" step="0.1" placeholder="Rainfall (mm)" required value="{{ values.rainfall if values else '' }}"><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h2>🌾 {{ prediction }}</h2>
    {% endif %}
</body>
</html>
